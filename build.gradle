plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "hollowatlas" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        // Generates the playable world from the region source data (see tools/build_world.sh).
        buildWorld {
            server()
            name "Build World"
            runDir "run-world"
            vmArg "-Dhollowatlas.autobuild=true"
            vmArg "-Dhollowatlas.autobuild.stop=true"
            vmArg "-Xmx6G"
        }
        // Generates the separate DEVELOPER TESTING world (no story content) in its own run folder.
        buildDevWorld {
            server()
            name "Build Dev Test World"
            runDir "run-devworld"
            vmArg "-Dhollowatlas.autobuild=true"
            vmArg "-Dhollowatlas.autobuild.stop=true"
            vmArg "-Dhollowatlas.mode=devtest"
            vmArg "-Xmx4G"
        }
        // Builds the 2000 x 2000 scenery SHOWCASE world (terrain + buildings only) in its own run folder.
        buildShowcaseWorld {
            server()
            name "Build Showcase World"
            runDir "run-showcase"
            vmArg "-Dhollowatlas.autobuild=true"
            vmArg "-Dhollowatlas.autobuild.stop=true"
            vmArg "-Dhollowatlas.mode=showcase"
            vmArg "-Xmx8G"
        }
        // Creates an EMPTY showcase world that builds itself the first time a player opens it (small download).
        prepareShowcaseWorld {
            server()
            name "Prepare Showcase Seed World"
            runDir "run-showcase-seed"
            vmArg "-Dhollowatlas.prepare=true"
            vmArg "-Dhollowatlas.mode=showcase"
            vmArg "-Xmx2G"
        }
        // Renders <world>/hollowatlas/region_map.png from the built world, then stops.
        renderMap {
            server()
            name "Render Map"
            runDir "run-world"
            vmArg "-Dhollowatlas.rendermap=true"
            vmArg "-Dhollowatlas.autobuild.stop=true"
            vmArg "-Xmx6G"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    testImplementation("org.junit.jupiter:junit-jupiter-api:5.10.2") { exclude group: "org.apiguardian" }
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:5.10.2") { exclude group: "org.apiguardian" }
    testRuntimeOnly("org.junit.platform:junit-platform-launcher:1.10.2") { exclude group: "org.apiguardian" }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

test {
    useJUnitPlatform()
    maxHeapSize = "3g"
    testLogging { showStandardStreams = true }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// Dev QA hooks: pass -Phollowatlas.autoshot=... / -Phollowatlas.autotest=... through to the client JVM.
tasks.matching { it.name == "runClient" }.configureEach {
    ["hollowatlas.autoshot", "hollowatlas.autotest", "hollowatlas.autotest.only", "hollowatlas.autotest.scale"].each { key ->
        if (project.hasProperty(key)) jvmArgs "-D${key}=" + project.property(key)
    }
}
